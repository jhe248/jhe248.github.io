<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jiahang He">
  <defs>
    <clipPath id="ring">
      <circle cx="32" cy="32" r="27"/>
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="27" fill="#FAFAF8"/>

  <g clip-path="url(#ring)">
    <!-- hair: dome with long side falls, symmetric about x=32 -->
    <path d="M32 9c11 0 17 7 17 17v28h-5V24c-3 1.6-7.5 2.6-12 2.6S23 25.6 20 24v30h-5V26c0-10 6-17 17-17z" fill="#1A1A1A"/>

    <!-- jacket -->
    <path d="M32 46c10 0 18 5 18 12v6H14v-6c0-7 8-12 18-12z" fill="#232323"/>
    <!-- red shirt -->
    <path d="M32 46l5 3.5-5 8.5-5-8.5z" fill="#D62828"/>

    <!-- face -->
    <path d="M20 24h24v13c0 7-5.4 12.5-12 12.5S20 44 20 37V24z" fill="#F7E7D2"/>

    <!-- glasses: open lenses, so the eyes read -->
    <g fill="#FDFCFA" stroke="#1A1A1A" stroke-width="1.8">
      <rect x="21.5" y="30.5" width="9.5" height="7.5" rx="2.4"/>
      <rect x="33" y="30.5" width="9.5" height="7.5" rx="2.4"/>
    </g>
    <path d="M31 34h2" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="26.2" cy="34.3" r="1.5" fill="#1A1A1A"/>
    <circle cx="37.8" cy="34.3" r="1.5" fill="#1A1A1A"/>

    <!-- smile -->
    <path d="M28.6 43c1.4 1.5 5.4 1.5 6.8 0" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <circle cx="32" cy="32" r="27" fill="none" stroke="#1A1A1A" stroke-width="4.5"/>
</svg>
